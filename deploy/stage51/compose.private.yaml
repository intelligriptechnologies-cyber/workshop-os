# Stage 51 only: private network, gateway published ONLY on host loopback.
services:
  private-https:
    image: caddy:2.11.4-alpine@sha256:6aeddd44c3078b0f9a35206472a11420648a79c184603ef95957d0a20044cb2b
    user: "1001:1001"
    environment: {XDG_CONFIG_HOME: /tmp/config, XDG_DATA_HOME: /tmp/data}
    restart: unless-stopped
    ports: ['127.0.0.1:18551:18551']
    read_only: true
    tmpfs: ['/tmp:size=16m,mode=1777']
    cap_drop: [ALL]
    # Official Caddy binary carries this file capability; retain its bounding bit.
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 64
    volumes:
      - ../stage51/Caddyfile.private:/etc/caddy/Caddyfile:ro
    secrets: [private_cert, private_key]
    networks: [proxy, private_ingress]
    depends_on:
      frontend: {condition: service_healthy}
    logging: {driver: json-file, options: {max-size: 10m, max-file: '3'}}
secrets:
  private_cert: {file: '${WORKSHOPOS_SECRETS_DIR}/private.crt'}
  private_key: {file: '${WORKSHOPOS_SECRETS_DIR}/private.key'}

# Only the gateway joins this bridge; publication remains host-loopback-only.
networks:
  private_ingress:
    driver: bridge
