worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log off;
  client_body_temp_path /tmp/client;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  client_max_body_size 3m;
  limit_req_zone $binary_remote_addr zone=login:1m rate=10r/m;
  server {
    listen 8080;
    server_tokens off;
    root /app/dist;
    auth_basic "Workshop OS private staging";
    auth_basic_user_file /run/secrets/access_htpasswd;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    location = /health { auth_basic off; default_type text/plain; return 200 "ok\n"; }
    location = /api/v1/auth/login {
      limit_req zone=login burst=10 nodelay;
      limit_req_status 429;
      proxy_pass http://api:8000;
      proxy_set_header Host $host;
      proxy_set_header Authorization "";
      proxy_set_header X-Forwarded-Proto https;
      proxy_no_cache 1;
    }
    location /api/ {
      proxy_pass http://api:8000;
      proxy_set_header Host $host;
      proxy_set_header Authorization "";
      proxy_set_header X-Forwarded-Proto https;
      proxy_no_cache 1;
    }
    location ~* \.(sqlite|db|dump|env|map)$ { return 404; }
    location ~ /\. { return 404; }
    location = /sw.js { add_header Cache-Control "no-cache" always; try_files $uri =404; }
    location = /index.html { add_header Cache-Control "no-store" always; }
    location / { try_files $uri $uri/ /index.html; }
  }
}
