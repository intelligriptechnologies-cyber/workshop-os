name: workshopos-staging

# Caddy is the sole public ingress. It reaches frontend:80 through the
# external workshopos-staging-proxy network. The app runs fully standalone
# (in-browser SQLite + client-side demo login) — no API/DB stack is deployed
# at this stage.
services:
  frontend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.staging
    restart: unless-stopped
    networks:
      workshopos-staging-proxy:
        aliases:
          - workshopos-frontend
    labels:
      com.workshopos.stack: staging
      com.workshopos.service: frontend

networks:
  # Managed by the existing Caddy deployment.
  workshopos-staging-proxy:
    external: true
    name: workshopos-staging-proxy
