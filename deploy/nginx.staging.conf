server {
    listen 80;
    listen [::]:80;

    root /app/dist;
    index index.html;

    location = /sw.js {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location = /health {
        add_header Content-Type text/plain always;
        return 200 "ok\n";
    }

    # No backend is deployed at this stage. The app runs fully in-browser
    # (local SQLite + client-side demo login), so serve a static "local,
    # demo allowed" auth config instead of proxying to a FastAPI container.
    location = /api/v1/auth/config {
        default_type application/json;
        return 200 '{"mode":"local","allowDemo":true}';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
