server {
    listen 80;
    listen [::]:80;

    root /app/dist;
    index index.html;

    location = /sw.js {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location = /api/v1/auth/config {
        default_type application/json;
        return 200 '{"mode":"local","allowDemo":true}';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
