services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: workshopos
      POSTGRES_USER: workshopos_admin
      POSTGRES_PASSWORD: workshopos_admin_local
    ports:
      - "5432:5432"
    volumes:
      - workshopos_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workshopos_admin -d workshopos"]
      interval: 2s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile.local
    environment:
      HOST: 0.0.0.0
      PORT: 4173
      DATABASE_ADMIN_URL: postgresql://workshopos_admin:workshopos_admin_local@db:5432/workshopos
      DATABASE_URL: postgresql://workshopos_app:workshopos_app_local@db:5432/workshopos
    ports:
      - "4173:4173"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4173/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 5s
      retries: 30

volumes:
  workshopos_postgres:
