services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: workshopos
      POSTGRES_USER: workshopos_admin
      POSTGRES_PASSWORD: workshopos_admin_local
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - workshopos_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workshopos_admin -d workshopos"]
      interval: 2s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile.local
    environment:
      WORKSHOPOS_DATABASE_URL: postgresql+psycopg://workshopos_admin:workshopos_admin_local@db:5432/workshopos
      WORKSHOPOS_ENVIRONMENT: local
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 3s
      timeout: 5s
      retries: 30

volumes:
  workshopos_postgres:
