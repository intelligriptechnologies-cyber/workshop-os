AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: WorkshopOS tenant-aware vertical (Mumbai-ready; deployment requires explicit authority)

Parameters:
  DatabaseSecretArn:
    Type: String
    NoEcho: true
  PrivateSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
  ApiSecurityGroupIds:
    Type: List<AWS::EC2::SecurityGroup::Id>
  OperationalAlertTopicArn:
    Type: String
    Description: Pre-authorized operations notification topic; deployment remains externally controlled
  CognitoDomainPrefix:
    Type: String
    Description: Globally unique prefix for the WorkshopOS managed-login domain
  CognitoCallbackUrls:
    Type: CommaDelimitedList
    Description: HTTPS OAuth callback URLs, plus localhost only for development
  CognitoLogoutUrls:
    Type: CommaDelimitedList
    Description: HTTPS post-logout URLs, plus localhost only for development

Resources:
  WorkshopUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: workshopos-users
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
        InviteMessageTemplate:
          EmailSubject: Your WorkshopOS invitation
          EmailMessage: "Your username is {username} and temporary password is {####}. Sign in to choose a new password."
          SMSMessage: "WorkshopOS username: {username}; temporary password: {####}"
      Policies:
        PasswordPolicy:
          MinimumLength: 10
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
          RequireUppercase: true
          TemporaryPasswordValidityDays: 7
      Schema:
        - Name: tenant_id
          AttributeDataType: String
          Mutable: false
          Required: false
          StringAttributeConstraints:
            MinLength: "36"
            MaxLength: "36"

  WorkshopUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref WorkshopUserPool
      ClientName: workshopos-browser
      GenerateSecret: false
      PreventUserExistenceErrors: ENABLED
      SupportedIdentityProviders: [COGNITO]
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email, profile]
      CallbackURLs: !Ref CognitoCallbackUrls
      LogoutURLs: !Ref CognitoLogoutUrls
      AccessTokenValidity: 60
      IdTokenValidity: 60
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days
      ReadAttributes: [email, email_verified, name, custom:tenant_id]
      WriteAttributes: [name]

  WorkshopUserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Ref CognitoDomainPrefix
      UserPoolId: !Ref WorkshopUserPool

  Api:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: v1

  TenantObjects:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled

  TenantWorkQueue:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 180
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt TenantWorkDeadLetterQueue.Arn
        maxReceiveCount: 5

  TenantWorkDeadLetterQueue:
    Type: AWS::SQS::Queue

  QueueAgeAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Oldest tenant work message exceeds the actionable recovery threshold
      Namespace: AWS/SQS
      MetricName: ApproximateAgeOfOldestMessage
      Dimensions:
        - Name: QueueName
          Value: !GetAtt TenantWorkQueue.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 900
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref OperationalAlertTopicArn

  DeadLetterAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Tenant work dead letters require authorized diagnosis and replay
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt TenantWorkDeadLetterQueue.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref OperationalAlertTopicArn

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: nodejs22.x
      Handler: dist/api.handler
      Timeout: 30
      VpcConfig:
        SubnetIds: !Ref PrivateSubnetIds
        SecurityGroupIds: !Ref ApiSecurityGroupIds
      Environment:
        Variables:
          DATABASE_SECRET_ARN: !Ref DatabaseSecretArn
          OBJECT_BUCKET: !Ref TenantObjects
          WORK_QUEUE_URL: !Ref TenantWorkQueue
          COGNITO_USER_POOL_ID: !Ref WorkshopUserPool
          COGNITO_APP_CLIENT_ID: !Ref WorkshopUserPoolClient
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref TenantObjects
        - SQSSendMessagePolicy:
            QueueName: !GetAtt TenantWorkQueue.QueueName
        - Statement:
            - Effect: Allow
              Action:
                - cognito-idp:AdminCreateUser
                - cognito-idp:AdminGetUser
                - cognito-idp:AdminDisableUser
              Resource: !GetAtt WorkshopUserPool.Arn
      Events:
        VersionedApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /api/v1/{proxy+}
            Method: ANY

  WorkerFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: nodejs22.x
      Handler: dist/worker.handler
      Timeout: 60
      Environment:
        Variables:
          DATABASE_SECRET_ARN: !Ref DatabaseSecretArn
          OBJECT_BUCKET: !Ref TenantObjects
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref TenantObjects
        - SQSPollerPolicy:
            QueueName: !GetAtt TenantWorkQueue.QueueName
      Events:
        TenantWork:
          Type: SQS
          Properties:
            Queue: !GetAtt TenantWorkQueue.Arn
            BatchSize: 10
            FunctionResponseTypes:
              - ReportBatchItemFailures

Outputs:
  ApiEndpoint:
    Value: !Sub https://${Api}.execute-api.${AWS::Region}.amazonaws.com/v1
  CognitoUserPoolId:
    Value: !Ref WorkshopUserPool
  CognitoAppClientId:
    Value: !Ref WorkshopUserPoolClient
  CognitoDomain:
    Value: !Sub https://${CognitoDomainPrefix}.auth.${AWS::Region}.amazoncognito.com
