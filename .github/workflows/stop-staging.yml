name: Stop staging

on:
  workflow_dispatch:

concurrency:
  group: workshopos-staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  stop:
    runs-on: ubuntu-latest
    env:
      HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
      HETZNER_USER: ${{ secrets.HETZNER_USER }}
      HETZNER_DEPLOY_KEY: ${{ secrets.HETZNER_DEPLOY_KEY }}
    steps:
      - name: Configure SSH
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$HETZNER_DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H -- "$HETZNER_HOST" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Stop staging services
        run: |
          ssh -o StrictHostKeyChecking=yes -i ~/.ssh/id_ed25519 "$HETZNER_USER@$HETZNER_HOST" <<'REMOTE'
            set -euo pipefail
            cd /opt/workshop/staging/source
            docker compose -f deploy/compose.staging.yaml --project-name workshopos-staging stop
          REMOTE
