name: Verify WorkshopOS

on:
  push:
    branches:
      - prem-dev-fbb-backend
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test:unit
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --workers=2

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: workshopos_test
          POSTGRES_USER: workshopos_test
          POSTGRES_PASSWORD: workshopos_test_local
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U workshopos_test -d workshopos_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      WORKSHOPOS_DATABASE_URL: postgresql+psycopg://workshopos_test:workshopos_test_local@127.0.0.1:5432/workshopos_test
      WORKSHOPOS_ENVIRONMENT: local
      PYTHONDONTWRITEBYTECODE: "1"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: alembic upgrade head
      - run: python -m pytest -q -m "not integration"
      - run: python -m pytest -q -m integration
